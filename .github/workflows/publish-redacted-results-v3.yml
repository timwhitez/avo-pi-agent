name: Publish final redacted ARC results v3

on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-public-benchmark
    paths:
      - 'results/trigger-v3/**'

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: publish-redacted-arc-results
  cancel-in-progress: true

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-redacted-results-v3]')
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Wait for final baseline and immutable repair-v7 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/avo-results/artifacts
          deadline=$((SECONDS + 41400))
          baseline_id=""
          repair_id=""
          while (( SECONDS < deadline )); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > /tmp/avo-results/artifacts.json
            readarray -t ids < <(node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/avo-results/artifacts.json', 'utf8').trim();
          const pages = text ? text.split(/\n(?=\{)/).filter(Boolean).map(JSON.parse) : [];
          const artifacts = pages.flatMap((page) => page.artifacts || [])
            .filter((artifact) => !artifact.expired)
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
          const baseline = artifacts.find((artifact) => /^arc-public-redacted-/.test(artifact.name));
          const repair = artifacts.find((artifact) => /^trajectory-repair-v7-redacted-/.test(artifact.name));
          console.log(baseline?.id || '');
          console.log(repair?.id || '');
          NODE
            )
            baseline_id="${ids[0]:-}"
            repair_id="${ids[1]:-}"
            if [[ -n "$baseline_id" && -n "$repair_id" ]]; then break; fi
            echo "Waiting for final artifacts (baseline=${baseline_id:-pending}, repair-v7=${repair_id:-pending})"
            sleep 60
          done
          if [[ -z "$baseline_id" || -z "$repair_id" ]]; then
            echo "::error::Timed out waiting for final baseline and trajectory-repair-v7 artifacts"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${baseline_id}/zip" > /tmp/avo-results/baseline.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${repair_id}/zip" > /tmp/avo-results/repair.zip
          unzip -q /tmp/avo-results/baseline.zip -d /tmp/avo-results/artifacts/baseline
          unzip -q /tmp/avo-results/repair.zip -d /tmp/avo-results/artifacts/repair

      - name: Validate and render exact redacted result documents
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-redacted-results.mjs \
            /tmp/avo-results/artifacts/baseline \
            /tmp/avo-results/artifacts/repair \
            /tmp/avo-results/generated
          cp /tmp/avo-results/generated/latest-results.redacted.json /tmp/latest-results.redacted.json
          cp /tmp/avo-results/generated/latest-results.md /tmp/latest-results.md

      - name: Synchronize latest branch head and commit result without races
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          mkdir -p docs/runs/automation
          cp /tmp/latest-results.redacted.json docs/runs/automation/latest-results.redacted.json
          cp /tmp/latest-results.md docs/runs/automation/latest-results.md
          node scripts/secret-scan.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runs/automation/latest-results.redacted.json docs/runs/automation/latest-results.md
          if git diff --cached --quiet; then
            echo "Result documents are unchanged"
          else
            git commit -m "docs(results): publish final redacted baseline and repair-v7 outcome"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Comment exact redacted outcome on tracking issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body-file docs/runs/automation/latest-results.md
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body-file docs/runs/automation/latest-results.md
