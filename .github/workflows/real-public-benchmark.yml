name: Real ARC-AGI-3 public benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-public-benchmark
    paths:
      - 'benchmarks/trigger/**'

permissions:
  contents: read
  statuses: write

env:
  OPENAI_BASE_URL: ${{ secrets.AVO_PROVIDER_BASE_URL }}
  OPENAI_API_KEY: ${{ secrets.AVO_PROVIDER_API_KEY }}
  OPENAI_MODEL: ${{ secrets.AVO_PROVIDER_MODEL }}
  OPENAI_REASONING_EFFORT: ${{ vars.AVO_PROVIDER_REASONING_EFFORT || 'max' }}
  # The official arc-agi SDK obtains a server-issued anonymous key whenever
  # ARC_API_KEY is empty. Keep the empty value explicit so .env.example cannot
  # replace it with a placeholder during python-dotenv loading.
  ARC_API_KEY: ''
  AVO_ARC_AUTH_MODE: anonymous-auto
  AVO_MIN_PUBLIC_GAMES: ${{ vars.AVO_MIN_PUBLIC_GAMES || '25' }}
  ARC_PYTHON: .venv/bin/python
  AVO_MAX_ACTIONS: ${{ vars.AVO_MAX_ACTIONS || '1000' }}
  AVO_MAX_OUTER_TURNS: ${{ vars.AVO_MAX_OUTER_TURNS || '1000' }}
  AVO_STALL_WINDOW: ${{ vars.AVO_STALL_WINDOW || '8' }}
  AVO_MEMORY_DIR: state/memory
  AVO_WORKSPACE_DIR: state/workspaces

concurrency:
  group: real-arc-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[real-public-run]')
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Validate encrypted provider configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${OPENAI_BASE_URL:-}" ]] || missing+=(AVO_PROVIDER_BASE_URL)
          [[ -n "${OPENAI_API_KEY:-}" ]] || missing+=(AVO_PROVIDER_API_KEY)
          [[ -n "${OPENAI_MODEL:-}" ]] || missing+=(AVO_PROVIDER_MODEL)
          if (( ${#missing[@]} )); then
            mkdir -p runs/public
            export AVO_MISSING_SECRET_NAMES="$(IFS=,; echo "${missing[*]}")"
            node <<'NODE'
          const fs = require('node:fs');
          const runId = process.env.AVO_REAL_RUN_ID || `gha-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const report = {
            schemaVersion: 1,
            runId,
            status: 'failed',
            failedStage: 'configuration',
            failedAt: new Date().toISOString(),
            error: `missing encrypted GitHub Actions secrets: ${process.env.AVO_MISSING_SECRET_NAMES}`,
          };
          fs.writeFileSync(`runs/public/${runId}.json`, `${JSON.stringify(report, null, 2)}\n`, { mode: 0o600 });
          NODE
            echo "::error::Missing required encrypted GitHub Actions secrets: ${AVO_MISSING_SECRET_NAMES}"
            exit 1
          fi
          echo "ARC authentication: official server-issued anonymous key (automatic, redacted)"
        env:
          AVO_REAL_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Install official ARC runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r bridge/requirements.txt

      - name: Run fail-closed real public benchmark
        env:
          AVO_REAL_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/run-real-public.mjs

      - name: Upload redacted benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arc-public-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/public/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload private trajectories and raw logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arc-public-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/private/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish redacted benchmark commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AVO_STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const publicDir = path.join(process.cwd(), 'runs', 'public');
          let report = null;
          if (fs.existsSync(publicDir)) {
            const files = fs.readdirSync(publicDir)
              .filter((name) => name.endsWith('.json'))
              .map((name) => ({ name, mtime: fs.statSync(path.join(publicDir, name)).mtimeMs }))
              .sort((a, b) => b.mtime - a.mtime);
            if (files[0]) {
              try { report = JSON.parse(fs.readFileSync(path.join(publicDir, files[0].name), 'utf8')); } catch {}
            }
          }
          const complete = report?.status === 'complete'
            && report?.officialScore?.value !== null
            && report?.officialScore?.value !== undefined;
          const stage = String(report?.failedStage || (complete ? 'complete' : 'workflow'))
            .replace(/[^A-Za-z0-9_.-]/g, '-')
            .slice(0, 80);
          const score = complete ? String(report.officialScore.value).slice(0, 40) : null;
          const description = complete
            ? `complete official score=${score}`
            : `failed stage=${stage}`;
          fs.writeFileSync('/tmp/avo-benchmark-status.json', JSON.stringify({
            state: complete ? 'success' : 'failure',
            context: 'real-public-benchmark',
            description: description.slice(0, 140),
            target_url: process.env.AVO_STATUS_TARGET_URL,
          }));
          NODE
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --input /tmp/avo-benchmark-status.json
