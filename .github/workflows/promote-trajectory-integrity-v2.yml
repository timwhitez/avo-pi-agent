name: Promote trajectory integrity gate v2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trajectory-repair-v3
    paths:
      - 'maintenance/promote-trajectory-integrity-v2.trigger'

permissions:
  contents: write

concurrency:
  group: promote-authoritative-trajectory-integrity
  cancel-in-progress: true

jobs:
  wait-verify-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Wait for stable v4 entry point to delegate to tested recorder v5
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))
          while (( SECONDS < deadline )); do
            git fetch origin "$GITHUB_REF_NAME"
            source="$(git show "origin/${GITHUB_REF_NAME}":bridge/recording_python_v4.py 2>/dev/null || true)"
            if grep -q 'recording_python_v5' <<<"$source"; then exit 0; fi
            echo 'Waiting for recorder-v5 promotion'
            sleep 20
          done
          echo '::error::Timed out waiting for recorder-v5 promotion'
          exit 1
      - name: Verify recorder protocol and trajectory-integrity regressions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          python -m py_compile bridge/recording_python_v4.py bridge/recording_python_v5.py
          node --test \
            test/recording-python-v5.test.mjs \
            test/trajectory-analyzer-v3.test.mjs \
            test/trajectory-integrity-v2.test.mjs
      - name: Make integrity-gated analyzer authoritative and retrigger repair-v10
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          python <<'PY'
          from pathlib import Path
          file = Path('scripts/run-trajectory-repair-round.mjs')
          text = file.read_text()
          text = text.replace("from '../src/trajectory/analyzer.mjs';", "from '../src/trajectory/analyzer-v2.mjs';")
          if "analyzer-v2.mjs" not in text:
              raise SystemExit('failed to promote analyzer-v2 import')
          if 'trajectoryIntegrity: analysis.integrity || null,' not in text:
              text = text.replace(
                  '  officialScore,\n  trajectoryFileCount:',
                  '  officialScore,\n  trajectoryIntegrity: analysis.integrity || null,\n  trajectoryFileCount:',
                  1,
              )
              text = text.replace(
                  '  officialScore: record.officialScore,\n  trajectoryFileCount:',
                  '  officialScore: record.officialScore,\n  trajectoryIntegrity: record.trajectoryIntegrity,\n  trajectoryFileCount:',
                  1,
              )
          if text.count('trajectoryIntegrity:') < 2:
              raise SystemExit('failed to expose integrity state in private and redacted round records')
          file.write_text(text)
          PY
          mkdir -p trajectory/trigger-v10
          cat > trajectory/trigger-v10/2026-08-23-integrity-gated-authoritative-rerun.md <<'EOF'
          # Integrity-gated authoritative repair-v10 rerun

          Replaces all earlier pending repair-v10 snapshots. A round can be clean only when recorder schema v5 is observed, `method + params` or legacy operations are recognized, every expected game has real step/act transitions, exact frame hashes exist, all registered detectors execute, parse errors are zero, and open findings are zero. No credential is stored here.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/trajectory/analyzer-v2.mjs \
            test/trajectory-integrity-v2.test.mjs \
            scripts/run-trajectory-repair-round.mjs \
            trajectory/trigger-v10/2026-08-23-integrity-gated-authoritative-rerun.md
          git commit -m "fix(trajectory): require method-aware transition integrity [trajectory-repair-v10]"
          git push origin HEAD:${GITHUB_REF_NAME}
