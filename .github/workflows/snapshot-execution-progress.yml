name: Snapshot AVO execution progress

on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-public-benchmark
    paths:
      - 'maintenance/snapshot-progress.trigger'

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Query latest authoritative workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/progress
          gh run list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json databaseId,workflowName,displayTitle,headBranch,headSha,status,conclusion,createdAt,startedAt,updatedAt,url,event \
            > /tmp/progress/runs.json
          node <<'NODE'
          const fs = require('node:fs');
          const runs = JSON.parse(fs.readFileSync('/tmp/progress/runs.json', 'utf8'));
          const definitions = [
            ['recordedBaseline', /Real ARC-AGI-3 public benchmark recorded/i, 'feature/real-public-benchmark'],
            ['repairV10', /Real trajectory multi-job repair and publish v10/i, 'feature/trajectory-repair-v3'],
            ['frontendSourcePatch', /Harden mission-control runtime defaults/i, 'feature/copilotkit-mission-control-v3'],
            ['frontendRestackV6', /Restack hardened mission control v6/i, 'feature/trajectory-repair-v3'],
            ['frontendPrV6', /Open verified mission-control v6 Draft PR/i, 'feature/trajectory-repair-v3'],
            ['prAudit', /Audit AVO Draft PR stack v2/i, 'feature/real-public-benchmark'],
            ['finalAcceptance', /Final AVO ARC acceptance gate/i, 'feature/real-public-benchmark'],
          ];
          const selected = {};
          for (const [key, pattern, branch] of definitions) {
            selected[key] = runs.filter((run) => pattern.test(run.workflowName || '') && run.headBranch === branch)
              .sort((a,b) => Date.parse(b.createdAt)-Date.parse(a.createdAt))[0] || null;
          }
          const out = { schemaVersion: 1, generatedAt: new Date().toISOString(), workflows: selected };
          fs.writeFileSync('/tmp/progress/progress.json', `${JSON.stringify(out, null, 2)}\n`);
          const lines = ['# AVO execution progress', '', `Generated: ${out.generatedAt}`, '', '| Workstream | Run | Status | Conclusion | Updated |', '|---|---:|---|---|---|'];
          for (const [key, run] of Object.entries(selected)) {
            lines.push(run
              ? `| ${key} | [${run.databaseId}](${run.url}) | ${run.status} | ${run.conclusion || '—'} | ${run.updatedAt || '—'} |`
              : `| ${key} | — | not-found | — | — |`);
          }
          lines.push('', 'This file contains workflow metadata only; it contains no provider, ARC, trajectory, or reasoning data.', '');
          fs.writeFileSync('/tmp/progress/progress.md', `${lines.join('\n')}\n`);
          NODE
      - name: Commit synchronized progress snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          mkdir -p docs/runs/automation
          cp /tmp/progress/progress.json docs/runs/automation/progress.json
          cp /tmp/progress/progress.md docs/runs/automation/progress.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runs/automation/progress.json docs/runs/automation/progress.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(progress): snapshot authoritative execution workflows"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Comment progress on Epic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file docs/runs/automation/progress.md
