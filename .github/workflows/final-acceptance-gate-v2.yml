name: Final AVO ARC acceptance gate v2

on:
  push:
    branches:
      - feature/real-public-benchmark
    paths:
      - 'docs/runs/automation/latest-results.redacted.json'

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate exact benchmark and trajectory evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('docs/runs/automation/latest-results.redacted.json', 'utf8'));
          const failures = [];
          const baseline = report.baseline || {};
          const repair = report.repair || {};
          const final = repair.final || {};
          const expected = Number(baseline.gamesExpected);
          const completed = Number(baseline.gamesCompleted);
          const score = Number(baseline.score?.value);
          if (baseline.complete !== true) failures.push('baseline-not-complete');
          if (!Number.isFinite(score)) failures.push('official-score-unavailable');
          if (!(expected > 0) || completed !== expected) failures.push('public-game-set-incomplete');
          if (!Array.isArray(baseline.games) || baseline.games.length !== expected) failures.push('per-game-table-incomplete');
          if (baseline.games?.some((game) => game.errorClass)) failures.push('one-or-more-game-errors');
          if (repair.status !== 'complete') failures.push('repair-loop-not-complete');
          if (repair.clean !== true) failures.push('trajectory-not-detector-clean');
          if (!Array.isArray(repair.rounds) || repair.rounds.length < 1) failures.push('repair-rounds-missing');
          if (!(Number(final.detectorsExpected) > 0) || Number(final.detectorsExecuted) !== Number(final.detectorsExpected)) failures.push('detector-coverage-incomplete');
          if (Number(final.openFindingCount) !== 0) failures.push('residual-open-findings');
          if (Number(final.parseErrorCount ?? 0) !== 0) failures.push('trajectory-parse-errors');
          fs.writeFileSync('/tmp/result-gate.json', JSON.stringify({
            failures,
            officialScore: Number.isFinite(score) ? score : null,
            gamesCompleted: completed,
            gamesExpected: expected,
            repairRounds: repair.rounds?.length || 0,
            repairFinalScore: final.officialScore?.value ?? null,
            detectorsExecuted: final.detectorsExecuted ?? null,
            detectorsExpected: final.detectorsExpected ?? null,
            openFindings: final.openFindingCount ?? null,
          }, null, 2));
          if (failures.length) process.exitCode = 2;
          NODE

      - name: Require the exact final CopilotKit v6 Draft PR and its branch-native production build
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3300))
          while (( SECONDS < deadline )); do
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head feature/copilotkit-mission-control-v6 \
              --json number,isDraft,mergedAt,headRefOid,url --jq '.[0] // empty')"
            if [[ -n "$pr" ]]; then
              number="$(jq -r .number <<<"$pr")"
              draft="$(jq -r .isDraft <<<"$pr")"
              merged="$(jq -r '.mergedAt // empty' <<<"$pr")"
              sha="$(jq -r .headRefOid <<<"$pr")"
              if [[ "$draft" == true && -z "$merged" ]]; then
                runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feature/copilotkit-mission-control-v6&per_page=100")"
                matching="$(jq --arg sha "$sha" '[.workflow_runs[] | select(.name == "mission-control-v6" and .head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty' <<<"$runs")"
                if [[ -n "$matching" ]]; then
                  status="$(jq -r .status <<<"$matching")"
                  conclusion="$(jq -r '.conclusion // empty' <<<"$matching")"
                  run_id="$(jq -r .id <<<"$matching")"
                  if [[ "$status" == completed && "$conclusion" == success ]]; then
                    jq -n --argjson number "$number" --arg sha "$sha" --argjson runId "$run_id" \
                      '{number:$number,headSha:$sha,workflowRunId:$runId}' > /tmp/frontend-gate.json
                    break
                  fi
                  if [[ "$status" == completed && "$conclusion" != success ]]; then
                    echo "::error::mission-control-v6 failed for exact PR head ${sha}: ${conclusion}"
                    exit 2
                  fi
                fi
              fi
            fi
            echo "Waiting for final v6 Draft PR and exact branch-native production build"
            sleep 30
          done
          [[ -s /tmp/frontend-gate.json ]] || { echo "::error::Final v6 PR/build gate did not pass"; exit 2; }

      - name: Require all tracked feature PRs to remain unmerged and Open targets to remain Draft
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
            --json number,headRefName,isDraft,mergedAt,state,url > /tmp/prs.json
          node <<'NODE'
          const fs = require('node:fs');
          const prs = JSON.parse(fs.readFileSync('/tmp/prs.json', 'utf8'));
          const target = /^(feature\/(?:avo-conformance|real-public-benchmark|trajectory-repair|copilotkit-mission-control))/;
          const tracked = prs.filter((pr) => target.test(pr.headRefName));
          const failures = tracked.filter((pr) => pr.mergedAt || (pr.state === 'OPEN' && !pr.isDraft));
          fs.writeFileSync('/tmp/pr-gate.json', JSON.stringify({ trackedCount: tracked.length, failures }, null, 2));
          if (failures.length) process.exit(2);
          NODE

      - name: Publish authoritative final acceptance result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/final-acceptance.md
          const fs = require('node:fs');
          const result = fs.existsSync('/tmp/result-gate.json') ? JSON.parse(fs.readFileSync('/tmp/result-gate.json', 'utf8')) : { failures: ['result-gate-missing'] };
          const frontend = fs.existsSync('/tmp/frontend-gate.json') ? JSON.parse(fs.readFileSync('/tmp/frontend-gate.json', 'utf8')) : null;
          const prs = fs.existsSync('/tmp/pr-gate.json') ? JSON.parse(fs.readFileSync('/tmp/pr-gate.json', 'utf8')) : null;
          const failures = [...(result.failures || [])];
          if (!frontend) failures.push('exact-frontend-v6-build-not-passing');
          if (!prs || prs.failures?.length) failures.push('draft-or-no-merge-invariant-failed');
          console.log('## Authoritative final AVO × Pi ARC-AGI-3 acceptance gate v2');
          console.log('');
          console.log(`Evaluated: ${new Date().toISOString()}`);
          console.log('');
          console.log(`- Gate: **${failures.length ? 'FAIL' : 'PASS'}**`);
          console.log(`- Official complete-public score: **${result.officialScore ?? 'unavailable'}**`);
          console.log(`- Games: **${result.gamesCompleted ?? '—'}/${result.gamesExpected ?? '—'}**`);
          console.log(`- Repair rounds: **${result.repairRounds ?? 0}**`);
          console.log(`- Final repair score: **${result.repairFinalScore ?? 'unavailable'}**`);
          console.log(`- Detector coverage: **${result.detectorsExecuted ?? '—'}/${result.detectorsExpected ?? '—'}**`);
          console.log(`- Open findings: **${result.openFindings ?? '—'}**`);
          console.log(`- Exact frontend PR/build: **${frontend ? `#${frontend.number}, workflow run ${frontend.workflowRunId}` : 'not passing'}**`);
          console.log(`- Tracked PRs: **${prs?.trackedCount ?? 'unavailable'}**, merge/draft failures: **${prs?.failures?.length ?? 'unavailable'}**`);
          console.log('');
          console.log(`- Failure codes: ${failures.length ? failures.map((value) => `\`${value}\``).join(', ') : 'none'}`);
          fs.writeFileSync('/tmp/final-state.txt', failures.length ? 'failure' : 'success');
          fs.writeFileSync('/tmp/final-description.txt', failures.length ? `acceptance failed: ${failures.slice(0, 3).join(',')}` : `accepted score=${result.officialScore} clean=true`);
          NODE
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/final-acceptance.md
          state="$(cat /tmp/final-state.txt)"
          description="$(cat /tmp/final-description.txt)"
          node -e 'require("fs").writeFileSync("/tmp/status.json", JSON.stringify({state:process.argv[1],context:"final-avo-arc-acceptance-v2",description:process.argv[2].slice(0,140),target_url:process.argv[3]}))' "$state" "$description" "$STATUS_TARGET"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --input /tmp/status.json
          [[ "$state" == success ]]
