name: Restack and verify mission control v5

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trajectory-repair-v3
    paths:
      - 'maintenance/restack-mission-control-v5.trigger'

permissions:
  contents: write

concurrency:
  group: restack-mission-control-v5
  cancel-in-progress: true

jobs:
  restack-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Create a clean UI branch from trajectory v3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/trajectory-repair-v3 feature/copilotkit-mission-control-v3
          git switch --force-create feature/copilotkit-mission-control-v5 origin/feature/trajectory-repair-v3
          git checkout origin/feature/copilotkit-mission-control-v3 -- \
            apps/mission-control-v3 \
            .github/workflows/mission-control-v3.yml

      - name: Install frontend dependencies
        working-directory: apps/mission-control-v3
        run: npm install --ignore-scripts

      - name: Run control-plane and session tests
        working-directory: apps/mission-control-v3
        run: npm test

      - name: Build standalone CopilotKit frontend
        working-directory: apps/mission-control-v3
        run: npm run build

      - name: Commit and push only after verification
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mission-control-v3 .github/workflows/mission-control-v3.yml
          git commit -m "feat(ui): restack verified CopilotKit mission control on trajectory v3"
          git push --force-with-lease origin HEAD:feature/copilotkit-mission-control-v5
