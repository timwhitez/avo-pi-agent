name: Restack final hardened mission control v6

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trajectory-repair-v3
    paths:
      - 'maintenance/restack-mission-control-v6-final.trigger'

permissions:
  contents: write

concurrency:
  group: restack-mission-control-v6
  cancel-in-progress: true

jobs:
  wait-restack-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@v5
        with: { node-version: '22.19.0', package-manager-cache: false }
      - name: Wait for automatic ARC auth plus recorder v4 source
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3000))
          while (( SECONDS < deadline )); do
            git fetch origin feature/copilotkit-mission-control-v3
            source="$(git show origin/feature/copilotkit-mission-control-v3:apps/mission-control-v3/lib/control-plane.mjs 2>/dev/null || true)"
            if grep -q "AVO_ARC_AUTH_MODE: 'anonymous-auto'" <<<"$source" \
              && grep -q "recording_python_v4.py" <<<"$source" \
              && git cat-file -e origin/feature/copilotkit-mission-control-v3:apps/mission-control-v3/test/frontend-contract.test.mjs; then
              exit 0
            fi
            echo "Waiting for final hardened frontend source"
            sleep 30
          done
          echo "::error::Timed out waiting for final hardened frontend source"
          exit 1
      - name: Rebuild UI-only branch on latest trajectory v3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/trajectory-repair-v3 feature/copilotkit-mission-control-v3
          git switch --force-create feature/copilotkit-mission-control-v6 origin/feature/trajectory-repair-v3
          git checkout origin/feature/copilotkit-mission-control-v3 -- apps/mission-control-v3 .github/workflows/mission-control-v3.yml
      - name: Install, test, and build final source
        working-directory: apps/mission-control-v3
        run: |
          npm install --ignore-scripts
          npm test
          npm run build
      - name: Publish verified final v6 branch
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mission-control-v3 .github/workflows/mission-control-v3.yml
          git commit -m "feat(ui): publish final hardened CopilotKit mission control v6"
          git push --force-with-lease origin HEAD:feature/copilotkit-mission-control-v6
