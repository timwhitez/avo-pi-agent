name: Restack hardened mission control v6

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trajectory-repair-v3
    paths:
      - 'maintenance/restack-mission-control-v6.trigger'

permissions:
  contents: write

concurrency:
  group: restack-mission-control-v6
  cancel-in-progress: true

jobs:
  wait-restack-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Wait for the verified frontend runtime patch
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          while (( SECONDS < deadline )); do
            git fetch origin feature/copilotkit-mission-control-v3
            if git show origin/feature/copilotkit-mission-control-v3:apps/mission-control-v3/lib/control-plane.mjs \
                | grep -q "AVO_ARC_AUTH_MODE: 'anonymous-auto'" \
              && git cat-file -e origin/feature/copilotkit-mission-control-v3:apps/mission-control-v3/test/frontend-contract.test.mjs; then
              exit 0
            fi
            echo "Waiting for hardened frontend source branch"
            sleep 30
          done
          echo "::error::Timed out waiting for the verified frontend runtime patch"
          exit 1

      - name: Create a clean branch directly on trajectory v3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/trajectory-repair-v3 feature/copilotkit-mission-control-v3
          git switch --force-create feature/copilotkit-mission-control-v6 origin/feature/trajectory-repair-v3
          git checkout origin/feature/copilotkit-mission-control-v3 -- \
            apps/mission-control-v3 \
            .github/workflows/mission-control-v3.yml

      - name: Install, test, and build before publication
        working-directory: apps/mission-control-v3
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm test
          npm run build

      - name: Commit and push verified UI-only stack
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mission-control-v3 .github/workflows/mission-control-v3.yml
          git commit -m "feat(ui): restack hardened CopilotKit mission control on trajectory v3"
          git push --force-with-lease origin HEAD:feature/copilotkit-mission-control-v6
