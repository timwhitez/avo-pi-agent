name: Final AVO ARC acceptance gate v3

on:
  push:
    branches:
      - feature/real-public-benchmark
    paths:
      - 'docs/runs/automation/latest-results.redacted.json'

permissions:
  contents: read
  issues: write
  statuses: write

jobs:
  integrity-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for acceptance-v2 score, frontend, Draft, and no-Merge gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3300))
          while (( SECONDS < deadline )); do
            statuses="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            state="$(jq -r '[.statuses[] | select(.context == "final-avo-arc-acceptance-v2")][0].state // empty' <<<"$statuses")"
            if [[ "$state" == success ]]; then exit 0; fi
            if [[ "$state" == failure || "$state" == error ]]; then
              echo "::error::acceptance-v2 failed for ${GITHUB_SHA}"
              exit 2
            fi
            echo 'Waiting for final-avo-arc-acceptance-v2 status'
            sleep 30
          done
          echo '::error::Timed out waiting for acceptance-v2'
          exit 2

      - name: Require method-aware exact-transition integrity for the final repair round
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('docs/runs/automation/latest-results.redacted.json', 'utf8'));
          const baseline = report.baseline || {};
          const final = report.repair?.final || {};
          const integrity = final.trajectoryIntegrity || final.integrity || {};
          const expected = Number(baseline.gamesExpected);
          const failures = [];
          if (integrity.passed !== true) failures.push('trajectory-integrity-not-passed');
          if (Number(integrity.recorderSchemaVersion) < 5) failures.push('recorder-schema-before-v5');
          if (integrity.methodProtocolObserved !== true) failures.push('method-aware-recorder-not-observed');
          if (!(expected > 0) || Number(integrity.transitionGameCount) !== expected) failures.push('real-transition-game-coverage-incomplete');
          if (!(Number(integrity.transitionCount) > 0)) failures.push('no-real-transitions');
          if (Array.isArray(integrity.missingTransitionGames) && integrity.missingTransitionGames.length) failures.push('missing-transition-games');
          if (Array.isArray(integrity.missingFrameHashGames) && integrity.missingFrameHashGames.length) failures.push('missing-frame-hash-games');
          if (Number(integrity.unknownOperationResponses) !== 0) failures.push('unknown-operation-responses');
          fs.writeFileSync('/tmp/integrity-gate.json', JSON.stringify({
            failures,
            officialScore: baseline.score?.value ?? null,
            gamesExpected: expected,
            repairClean: report.repair?.clean === true,
            integrity,
          }, null, 2));
          if (failures.length) process.exit(2);
          NODE

      - name: Publish authoritative acceptance-v3 result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/acceptance-v3.md
          const fs = require('node:fs');
          const result = fs.existsSync('/tmp/integrity-gate.json')
            ? JSON.parse(fs.readFileSync('/tmp/integrity-gate.json', 'utf8'))
            : { failures: ['integrity-gate-missing'], integrity: {} };
          const failures = result.failures || [];
          const value = result.integrity || {};
          console.log('## Authoritative final AVO × Pi ARC-AGI-3 acceptance gate v3');
          console.log('');
          console.log(`Evaluated: ${new Date().toISOString()}`);
          console.log('');
          console.log(`- Gate: **${failures.length ? 'FAIL' : 'PASS'}**`);
          console.log(`- Official score: **${result.officialScore ?? 'unavailable'}**`);
          console.log(`- Repair detector-clean: **${result.repairClean === true}**`);
          console.log(`- Recorder schema: **${value.recorderSchemaVersion ?? 'unavailable'}**`);
          console.log(`- Method-aware protocol observed: **${value.methodProtocolObserved === true}**`);
          console.log(`- Real transition game coverage: **${value.transitionGameCount ?? '—'}/${result.gamesExpected ?? '—'}**`);
          console.log(`- Real transitions: **${value.transitionCount ?? '—'}**`);
          console.log(`- Missing transition games: **${value.missingTransitionGames?.length ?? '—'}**`);
          console.log(`- Missing frame-hash games: **${value.missingFrameHashGames?.length ?? '—'}**`);
          console.log(`- Unknown operation responses: **${value.unknownOperationResponses ?? '—'}**`);
          console.log('');
          console.log(`- Failure codes: ${failures.length ? failures.map((item) => `\`${item}\``).join(', ') : 'none'}`);
          fs.writeFileSync('/tmp/state.txt', failures.length ? 'failure' : 'success');
          fs.writeFileSync('/tmp/description.txt', failures.length
            ? `integrity failed: ${failures.slice(0, 3).join(',')}`
            : `accepted score=${result.officialScore} clean=true recorder=v${value.recorderSchemaVersion}`);
          NODE
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/acceptance-v3.md
          state="$(cat /tmp/state.txt)"
          description="$(cat /tmp/description.txt)"
          node -e 'require("fs").writeFileSync("/tmp/status.json", JSON.stringify({state:process.argv[1],context:"final-avo-arc-acceptance-v3",description:process.argv[2].slice(0,140),target_url:process.argv[3]}))' "$state" "$description" "$STATUS_TARGET"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --input /tmp/status.json
          [[ "$state" == success ]]
