name: Open verified mission-control v6 Draft PR

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trajectory-repair-v3
    paths:
      - 'maintenance/open-mission-control-v6-pr.trigger'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  wait-and-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for verified UI branch and open or update Draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5100))
          while (( SECONDS < deadline )); do
            if gh api "repos/${GITHUB_REPOSITORY}/branches/feature/copilotkit-mission-control-v6" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for verified mission-control v6 branch"
            sleep 30
          done
          gh api "repos/${GITHUB_REPOSITORY}/branches/feature/copilotkit-mission-control-v6" >/dev/null
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head feature/copilotkit-mission-control-v6 --json number --jq '.[0].number // empty')"
          body_file=/tmp/mission-control-pr.md
          cat > "$body_file" <<'EOF'
          ## Summary

          Final hardened CopilotKit mission-control stack, based directly on `feature/trajectory-repair-v3` and published only after control-plane/session/browser-contract tests plus a standalone Next.js production build pass.

          ### Complete agent surface
          - start selected diagnostic games or the complete public set;
          - automatic anonymous official ARC authentication for UI-started runs;
          - automatic private recorder v3 for exact ARC, supervisor, memory, and lineage evidence;
          - pause, resume, and exact-run-ID-confirmed abort;
          - reconnectable cursor-based lifecycle events;
          - exact ARC frame rendering and synchronized trajectory replay;
          - memory, proposal/attempt/committed lineage, supervisor, and detector inspection;
          - baseline versus post-fix comparison;
          - CopilotKit readable state and typed actions for every lifecycle operation.

          ### Security boundary
          Provider endpoint, key, model ID, ARC credential, raw private payloads, and raw reasoning stay server-side. Mutations require an HttpOnly same-origin session plus CSRF validation; abort additionally requires exact run-ID confirmation. Browser-contract tests reject client-side credential surfaces.

          ### Deployment boundary
          Long-lived process ownership requires a private single-instance/self-hosted Node deployment. An authenticated reverse proxy is required for remote multi-user access.

          Closes #5
          Relates to #9

          This PR is intentionally Draft and must not be merged as part of the current task.
          EOF
          if [[ -z "$existing" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --head feature/copilotkit-mission-control-v6 \
              --base feature/trajectory-repair-v3 \
              --title "feat: hardened CopilotKit mission control with automatic ARC recording" \
              --body-file "$body_file" \
              --draft
          else
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title "feat: hardened CopilotKit mission control with automatic ARC recording" \
              --body-file "$body_file" \
              --base feature/trajectory-repair-v3
            if [[ "$(gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
              gh pr ready "$existing" --repo "$GITHUB_REPOSITORY" --undo
            fi
          fi
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body "Final frontend implementation is the verified Draft PR from \`feature/copilotkit-mission-control-v6\` to \`feature/trajectory-repair-v3\`. Older UI PRs remain unmerged and superseded."
