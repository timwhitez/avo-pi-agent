name: Audit AVO Draft PR stack v2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-public-benchmark
    paths:
      - 'maintenance/audit-draft-prs-v2.trigger'

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enforce Draft and collect merge invariants
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
            --json number,headRefName,isDraft,mergedAt,state,title,url > /tmp/prs.json
          node <<'NODE' > /tmp/targets.tsv
          const fs = require('node:fs');
          const prs = JSON.parse(fs.readFileSync('/tmp/prs.json', 'utf8'));
          const target = /^(feature\/(?:avo-conformance|real-public-benchmark|trajectory-repair|copilotkit-mission-control))/;
          for (const pr of prs.filter((entry) => target.test(entry.headRefName))) {
            console.log([pr.number, pr.headRefName, pr.state, pr.isDraft, pr.mergedAt || '', pr.url].join('\t'));
          }
          NODE
          merged=0
          while IFS=$'\t' read -r number head state draft merged_at url; do
            [[ -n "$number" ]] || continue
            if [[ -n "$merged_at" ]]; then
              echo "::error::Target PR #${number} (${head}) was merged at ${merged_at}"
              merged=1
            elif [[ "$state" == "OPEN" && "$draft" != "true" ]]; then
              gh pr ready "$number" --repo "$GITHUB_REPOSITORY" --undo
            fi
          done < /tmp/targets.tsv
          echo "merged_detected=${merged}" >> "$GITHUB_ENV"

      - name: Render and comment audit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
            --json number,headRefName,isDraft,mergedAt,state,title,url > /tmp/prs-after.json
          node <<'NODE' > /tmp/pr-audit.md
          const fs = require('node:fs');
          const prs = JSON.parse(fs.readFileSync('/tmp/prs-after.json', 'utf8'));
          const target = /^(feature\/(?:avo-conformance|real-public-benchmark|trajectory-repair|copilotkit-mission-control))/;
          const rows = prs.filter((entry) => target.test(entry.headRefName)).sort((a, b) => a.number - b.number);
          const merged = rows.filter((entry) => entry.mergedAt);
          console.log('## Automated Draft / no-Merge audit v2');
          console.log('');
          console.log(`Audited at: ${new Date().toISOString()}`);
          console.log('');
          console.log('| PR | Head | State | Draft | Merged |');
          console.log('|---:|---|---|---:|---:|');
          for (const pr of rows) console.log(`| #${pr.number} | \`${pr.headRefName}\` | ${pr.state} | ${pr.isDraft} | ${Boolean(pr.mergedAt)} |`);
          console.log('');
          console.log(merged.length ? `**ERROR:** ${merged.length} tracked PR(s) have non-null mergedAt.` : '**PASS:** every tracked PR has mergedAt=null; every open tracked PR is Draft.');
          NODE
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-audit.md

      - name: Publish audit commit status and fail on a merge
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "${merged_detected:-1}" == "0" ]]; then
            state=success
            description='all tracked PRs are unmerged; open PRs are Draft'
          else
            state=failure
            description='one or more tracked PRs have mergedAt != null'
          fi
          node -e 'require("fs").writeFileSync("/tmp/status.json", JSON.stringify({state:process.argv[1],context:"avo-pr-stack-audit",description:process.argv[2],target_url:process.argv[3]}))' "$state" "$description" "$STATUS_TARGET"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --input /tmp/status.json
          [[ "$state" == success ]]
