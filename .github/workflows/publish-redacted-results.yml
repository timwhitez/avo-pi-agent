name: Publish latest redacted ARC results

on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-public-benchmark
    paths:
      - 'results/trigger/**'

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: publish-redacted-arc-results
  cancel-in-progress: true

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-redacted-results]')
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Wait for and download latest redacted artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/avo-results/artifacts
          deadline=$((SECONDS + 41400))
          baseline_id=""
          repair_id=""
          while (( SECONDS < deadline )); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > /tmp/avo-results/artifacts.json
            readarray -t ids < <(node <<'NODE'
          const fs = require('node:fs');
          const pages = fs.readFileSync('/tmp/avo-results/artifacts.json', 'utf8')
            .trim().split(/\n(?=\{)/).filter(Boolean).map(JSON.parse);
          const artifacts = pages.flatMap((page) => page.artifacts || [])
            .filter((artifact) => !artifact.expired)
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
          const baseline = artifacts.find((artifact) => /^arc-public-redacted-/.test(artifact.name));
          const repair = artifacts.find((artifact) => /^trajectory-repair-v4-redacted-/.test(artifact.name));
          console.log(baseline?.id || '');
          console.log(repair?.id || '');
          NODE
            )
            baseline_id="${ids[0]:-}"
            repair_id="${ids[1]:-}"
            if [[ -n "$baseline_id" && -n "$repair_id" ]]; then break; fi
            echo "Waiting for redacted artifacts (baseline=${baseline_id:-pending}, repair=${repair_id:-pending})"
            sleep 60
          done
          if [[ -z "$baseline_id" || -z "$repair_id" ]]; then
            echo "::error::Timed out waiting for baseline and trajectory-repair-v4 redacted artifacts"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${baseline_id}/zip" > /tmp/avo-results/baseline.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${repair_id}/zip" > /tmp/avo-results/repair.zip
          unzip -q /tmp/avo-results/baseline.zip -d /tmp/avo-results/artifacts/baseline
          unzip -q /tmp/avo-results/repair.zip -d /tmp/avo-results/artifacts/repair

      - name: Validate, normalize, and render redacted results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/runs/automation
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const walk = (root) => fs.existsSync(root)
            ? fs.readdirSync(root, { withFileTypes: true }).flatMap((entry) => {
                const full = path.join(root, entry.name);
                return entry.isDirectory() ? walk(full) : [full];
              })
            : [];
          const jsonFiles = (root) => walk(root).filter((file) => file.endsWith('.json'))
            .map((file) => ({ file, mtime: fs.statSync(file).mtimeMs }))
            .sort((a, b) => b.mtime - a.mtime);
          const readFirst = (root, predicate) => {
            for (const item of jsonFiles(root)) {
              try {
                const value = JSON.parse(fs.readFileSync(item.file, 'utf8'));
                if (!predicate || predicate(value, item.file)) return { value, file: item.file };
              } catch {}
            }
            return null;
          };
          const baselineEntry = readFirst('/tmp/avo-results/artifacts/baseline', (value) =>
            value && (value.officialScore !== undefined || value.scorecard !== undefined || value.status !== undefined));
          const repairEntry = readFirst('/tmp/avo-results/artifacts/repair', (value, file) =>
            /trajectory-repair-.*redacted/i.test(file) || (value && value.acceptanceRule && value.rounds));
          if (!baselineEntry) throw new Error('No redacted benchmark JSON found in baseline artifact');
          if (!repairEntry) throw new Error('No redacted repair-loop JSON found in repair artifact');

          const forbiddenKey = /(?:api.?key|authorization|token|secret|base.?url|endpoint|raw.?reasoning|provider.?model|model.?id)/i;
          const forbiddenText = /https?:\/\/|\b(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?\b|\bsk-[A-Za-z0-9_-]{12,}\b|authorization\s*[:=]/i;
          function assertRedacted(value, location = '$') {
            if (typeof value === 'string') {
              if (forbiddenText.test(value)) throw new Error(`Private-looking material in ${location}`);
              return;
            }
            if (Array.isArray(value)) return value.forEach((item, index) => assertRedacted(item, `${location}[${index}]`));
            if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value)) {
                if (forbiddenKey.test(key) && child !== '<redacted>' && child !== null && child !== false) {
                  throw new Error(`Forbidden field ${location}.${key}`);
                }
                assertRedacted(child, `${location}.${key}`);
              }
            }
          }
          assertRedacted(baselineEntry.value, '$.baseline');
          assertRedacted(repairEntry.value, '$.repair');

          const pickScore = (report) => {
            const candidates = [
              ['officialScore.value', report?.officialScore?.value],
              ['officialScore', typeof report?.officialScore === 'number' ? report.officialScore : null],
              ['scorecard.score', report?.scorecard?.score],
              ['summary.officialScore', report?.summary?.officialScore],
              ['score.value', report?.score?.value],
            ];
            for (const [origin, value] of candidates) if (Number.isFinite(Number(value))) return { value: Number(value), origin };
            return { value: null, origin: report?.scoreOrigin || 'unavailable' };
          };
          const gameRows = (report) => {
            const value = report?.games || report?.perGame || report?.results || report?.manifest?.games || [];
            if (Array.isArray(value)) return value;
            if (value && typeof value === 'object') return Object.entries(value).map(([gameId, row]) => ({ gameId, ...row }));
            return [];
          };
          const normalizeGame = (row, index) => ({
            gameId: String(row?.gameId || row?.game_id || row?.id || `game-${index + 1}`),
            state: row?.state || row?.finalState || row?.terminalState || null,
            levelsCompleted: Number(row?.levelsCompleted ?? row?.levels_completed ?? row?.levels ?? 0),
            winLevels: Number(row?.winLevels ?? row?.win_levels ?? row?.totalLevels ?? 0),
            actions: Number(row?.actions ?? row?.actionCount ?? row?.action_counter ?? 0),
            errorClass: row?.errorClass || row?.error_class || null,
          });
          const baselineGames = gameRows(baselineEntry.value).map(normalizeGame);
          const score = pickScore(baselineEntry.value);
          const repair = repairEntry.value;
          const normalized = {
            schemaVersion: 1,
            publishedAt: new Date().toISOString(),
            baseline: {
              status: baselineEntry.value.status || null,
              complete: baselineEntry.value.complete === true || baselineEntry.value.status === 'complete',
              score,
              gamesExpected: Number(baselineEntry.value.gamesExpected ?? baselineEntry.value.expectedGameCount ?? baselineGames.length),
              gamesCompleted: Number(baselineEntry.value.gamesCompleted ?? baselineEntry.value.completedGameCount ?? baselineGames.length),
              games: baselineGames,
              sourceSha256: crypto.createHash('sha256').update(JSON.stringify(baselineEntry.value)).digest('hex'),
            },
            repair: {
              status: repair.status || null,
              clean: repair.clean === true,
              rounds: Array.isArray(repair.rounds) ? repair.rounds : [],
              baseline: repair.baseline || null,
              final: repair.final || null,
              failure: repair.failure || null,
              acceptanceRule: repair.acceptanceRule || null,
              sourceSha256: crypto.createHash('sha256').update(JSON.stringify(repair)).digest('hex'),
            },
          };
          fs.writeFileSync('docs/runs/automation/latest-results.redacted.json', `${JSON.stringify(normalized, null, 2)}\n`);

          const escape = (value) => String(value ?? '—').replace(/\|/g, '\\|').replace(/\n/g, ' ');
          const lines = [
            '# Latest real-provider ARC-AGI-3 results',
            '',
            `Published: ${normalized.publishedAt}`,
            '',
            '## Complete public baseline',
            '',
            `- Status: **${escape(normalized.baseline.status)}**`,
            `- Complete: **${normalized.baseline.complete}**`,
            `- Official score: **${escape(normalized.baseline.score.value)}**`,
            `- Score origin: \`${escape(normalized.baseline.score.origin)}\``,
            `- Games completed: **${normalized.baseline.gamesCompleted}/${normalized.baseline.gamesExpected}**`,
            '',
            '| Game | State | Levels | Actions | Error |',
            '|---|---:|---:|---:|---|',
            ...normalized.baseline.games.map((game) => `| ${escape(game.gameId)} | ${escape(game.state)} | ${game.levelsCompleted}/${game.winLevels || '—'} | ${game.actions} | ${escape(game.errorClass)} |`),
            '',
            '## Trajectory repair loop',
            '',
            `- Status: **${escape(normalized.repair.status)}**`,
            `- Detector-complete clean: **${normalized.repair.clean}**`,
            `- Rounds: **${normalized.repair.rounds.length}**`,
            `- Baseline official score: **${escape(normalized.repair.baseline?.officialScore?.value)}**`,
            `- Final official score: **${escape(normalized.repair.final?.officialScore?.value)}**`,
            `- Baseline open findings: **${escape(normalized.repair.baseline?.openFindingCount)}**`,
            `- Final open findings: **${escape(normalized.repair.final?.openFindingCount)}**`,
            `- Failure stage: **${escape(normalized.repair.failure?.stage)}**`,
            '',
            '> A clean result is accepted only under the detector-complete rule recorded in the JSON report. Raw trajectories remain private Actions artifacts.',
            '',
          ];
          fs.writeFileSync('docs/runs/automation/latest-results.md', `${lines.join('\n')}\n`);
          NODE
          node scripts/secret-scan.mjs

      - name: Commit redacted results to benchmark draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runs/automation/latest-results.redacted.json docs/runs/automation/latest-results.md
          if git diff --cached --quiet; then
            echo "Result documents are unchanged"
          else
            git commit -m "docs(results): publish latest redacted real benchmark and repair outcome"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Comment exact redacted result on tracking issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(cat docs/runs/automation/latest-results.md)"
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "$body"
