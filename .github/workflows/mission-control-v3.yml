name: mission-control-v3

on:
  push:
    branches:
      - feature/copilotkit-mission-control-v3
    paths:
      - 'apps/mission-control-v3/**'
      - '.github/workflows/mission-control-v3.yml'
  pull_request:
    paths:
      - 'apps/mission-control-v3/**'
      - '.github/workflows/mission-control-v3.yml'

permissions:
  contents: read

jobs:
  verify-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mission-control-v3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Run control-plane tests
        run: npm test
      - name: Build standalone frontend
        run: npm run build
