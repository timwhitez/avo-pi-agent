name: Real trajectory repair and publish v8

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trajectory-repair-v3
    paths:
      - 'trajectory/trigger-v8/**'

permissions:
  actions: read
  contents: write
  issues: write
  statuses: write

env:
  OPENAI_BASE_URL: ${{ secrets.AVO_PROVIDER_BASE_URL }}
  OPENAI_API_KEY: ${{ secrets.AVO_PROVIDER_API_KEY }}
  OPENAI_MODEL: ${{ secrets.AVO_PROVIDER_MODEL }}
  OPENAI_REASONING_EFFORT: ${{ vars.AVO_PROVIDER_REASONING_EFFORT || 'max' }}
  ARC_API_KEY: ''
  AVO_ARC_AUTH_MODE: anonymous-auto
  ARC_PYTHON: bridge/recording_python_v4.py
  AVO_REAL_PYTHON: .venv/bin/python
  AVO_MAX_ACTIONS: ${{ vars.AVO_MAX_ACTIONS || '1000' }}
  AVO_MAX_OUTER_TURNS: ${{ vars.AVO_REPAIR_MAX_OUTER_TURNS || '32' }}
  AVO_STALL_WINDOW: ${{ vars.AVO_STALL_WINDOW || '8' }}
  AVO_REPAIR_MAX_ROUNDS: ${{ vars.AVO_REPAIR_MAX_ROUNDS || '3' }}

concurrency:
  group: real-arc-public-refs/heads/feature/real-public-benchmark
  cancel-in-progress: false

jobs:
  repair-and-publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[trajectory-repair-v8]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Validate encrypted runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${OPENAI_BASE_URL:-}" ]] || missing+=(AVO_PROVIDER_BASE_URL)
          [[ -n "${OPENAI_API_KEY:-}" ]] || missing+=(AVO_PROVIDER_API_KEY)
          [[ -n "${OPENAI_MODEL:-}" ]] || missing+=(AVO_PROVIDER_MODEL)
          if (( ${#missing[@]} )); then
            echo "::error::Missing required encrypted GitHub Actions secrets: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r bridge/requirements.txt
          chmod +x bridge/recording_python_v2.py bridge/recording_python_v3.py bridge/recording_python_v4.py scripts/analyze-trajectories.mjs scripts/run-trajectory-repair-loop.mjs
          .venv/bin/python -m py_compile bridge/arc_bridge.py bridge/recording_python_v2.py bridge/recording_python_v3.py bridge/recording_python_v4.py

      - name: Verify detector and full-evidence recorder regressions
        run: node --test test/trajectory-analyzer-v3.test.mjs test/recording-python-v2.test.mjs test/recording-python-v4.test.mjs

      - name: Run real-provider analyze repair rerun loop with private process capture
        id: repair
        continue-on-error: true
        shell: bash
        env:
          AVO_REPAIR_RUN_ID: gha-repair-v8-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          mkdir -p "runs/private/repair-loop/${AVO_REPAIR_RUN_ID}"
          node scripts/run-trajectory-repair-loop.mjs --max-rounds "${AVO_REPAIR_MAX_ROUNDS}" \
            2>&1 | tee "runs/private/repair-loop/${AVO_REPAIR_RUN_ID}/process.log"
          code="${PIPESTATUS[0]}"
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload redacted repair comparison
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trajectory-repair-v8-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/public/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload private ARC, memory, lineage, analysis, and process evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trajectory-repair-v8-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/private/
            state/repair-loop/
          if-no-files-found: warn
          retention-days: 7

      - name: Download latest complete-public redacted baseline artifact
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-results/baseline
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > /tmp/final-results/artifacts.json
          baseline_id="$(node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/final-results/artifacts.json', 'utf8').trim();
          const pages = text ? text.split(/\n(?=\{)/).filter(Boolean).map(JSON.parse) : [];
          const artifact = pages.flatMap((page) => page.artifacts || [])
            .filter((entry) => !entry.expired && /^arc-public-redacted-/.test(entry.name))
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
          process.stdout.write(String(artifact?.id || ''));
          NODE
          )"
          [[ -n "$baseline_id" ]] || { echo "::error::No redacted complete-public baseline artifact is available"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${baseline_id}/zip" > /tmp/final-results/baseline.zip
          unzip -q /tmp/final-results/baseline.zip -d /tmp/final-results/baseline

      - name: Render and validate deterministic redacted result documents
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/real-public-benchmark
          git show origin/feature/real-public-benchmark:scripts/publish-redacted-results.mjs > /tmp/publish-redacted-results.mjs
          node /tmp/publish-redacted-results.mjs \
            /tmp/final-results/baseline \
            runs/public \
            /tmp/final-results/generated
          cp /tmp/final-results/generated/latest-results.redacted.json /tmp/latest-results.redacted.json
          cp /tmp/final-results/generated/latest-results.md /tmp/latest-results.md

      - name: Commit exact redacted results to the benchmark Draft branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/benchmark-results
          git fetch origin feature/real-public-benchmark
          git worktree add --detach /tmp/benchmark-results origin/feature/real-public-benchmark
          cd /tmp/benchmark-results
          mkdir -p docs/runs/automation
          cp /tmp/latest-results.redacted.json docs/runs/automation/latest-results.redacted.json
          cp /tmp/latest-results.md docs/runs/automation/latest-results.md
          node scripts/secret-scan.mjs
          git add docs/runs/automation/latest-results.redacted.json docs/runs/automation/latest-results.md
          if git diff --cached --quiet; then
            echo "Result documents are unchanged"
            exit 0
          fi
          git commit -m "docs(results): publish final redacted baseline and repair-v8 outcome"
          for attempt in 1 2 3; do
            git fetch origin feature/real-public-benchmark
            git rebase origin/feature/real-public-benchmark
            if git push origin HEAD:feature/real-public-benchmark; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Unable to publish redacted results after three synchronized attempts"
          exit 1

      - name: Comment exact result on benchmark, trajectory, and Epic issues
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body-file /tmp/latest-results.md
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body-file /tmp/latest-results.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/latest-results.md

      - name: Publish final repair commit status and preserve failure semantics
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          let report = null;
          try { report = JSON.parse(fs.readFileSync('/tmp/latest-results.redacted.json', 'utf8')); } catch {}
          const clean = report?.repair?.status === 'complete' && report?.repair?.clean === true;
          const rounds = Number(report?.repair?.rounds?.length || 0);
          const findings = Number(report?.repair?.final?.openFindingCount ?? -1);
          const score = report?.repair?.final?.officialScore?.value;
          fs.writeFileSync('/tmp/status.json', JSON.stringify({
            state: clean ? 'success' : 'failure',
            context: 'trajectory-repair-v8',
            description: (clean
              ? `clean rounds=${rounds} score=${String(score ?? 'unavailable').slice(0, 40)}`
              : `not clean rounds=${rounds} open=${findings}`).slice(0, 140),
            target_url: process.env.STATUS_TARGET,
          }));
          fs.writeFileSync('/tmp/clean.txt', String(clean));
          NODE
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --input /tmp/status.json
          [[ "$(cat /tmp/clean.txt)" == "true" ]]
