name: Real ARC-AGI-3 public benchmark recorded

on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-public-benchmark
    paths:
      - 'benchmarks/trigger-recorded/**'

permissions:
  contents: read
  statuses: write

env:
  OPENAI_BASE_URL: ${{ secrets.AVO_PROVIDER_BASE_URL }}
  OPENAI_API_KEY: ${{ secrets.AVO_PROVIDER_API_KEY }}
  OPENAI_MODEL: ${{ secrets.AVO_PROVIDER_MODEL }}
  OPENAI_REASONING_EFFORT: ${{ vars.AVO_PROVIDER_REASONING_EFFORT || 'max' }}
  ARC_API_KEY: ''
  AVO_ARC_AUTH_MODE: anonymous-auto
  ARC_PYTHON: bridge/recording_python.py
  AVO_REAL_PYTHON: .venv/bin/python
  AVO_MAX_ACTIONS: ${{ vars.AVO_MAX_ACTIONS || '1000' }}
  AVO_MAX_OUTER_TURNS: ${{ vars.AVO_MAX_OUTER_TURNS || '64' }}
  AVO_STALL_WINDOW: ${{ vars.AVO_STALL_WINDOW || '8' }}
  AVO_MEMORY_DIR: state/memory
  AVO_WORKSPACE_DIR: state/workspaces

concurrency:
  group: real-arc-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[real-public-recorded-run]')
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Validate encrypted runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${OPENAI_BASE_URL:-}" ]] || missing+=(AVO_PROVIDER_BASE_URL)
          [[ -n "${OPENAI_API_KEY:-}" ]] || missing+=(AVO_PROVIDER_API_KEY)
          [[ -n "${OPENAI_MODEL:-}" ]] || missing+=(AVO_PROVIDER_MODEL)
          if (( ${#missing[@]} )); then
            mkdir -p runs/public
            printf '{"schemaVersion":1,"status":"failed","failedStage":"configuration","missingSecretNames":"%s"}\n' "$(IFS=,; echo "${missing[*]}")" > runs/public/configuration-failure.json
            echo "::error::Missing required encrypted GitHub Actions secrets: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Install official ARC runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r bridge/requirements.txt
          chmod +x bridge/recording_python.py
          .venv/bin/python -m py_compile bridge/arc_bridge.py bridge/recording_python.py

      - name: Run fail-closed recorded real public benchmark
        env:
          AVO_REAL_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          AVO_TRAJECTORY_DIR: runs/private/trajectories/gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/run-real-public.mjs

      - name: Upload redacted benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arc-public-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/public/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload private trajectories and raw logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arc-public-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/private/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish redacted benchmark commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.join(process.cwd(), 'runs', 'public');
          let report = null;
          if (fs.existsSync(dir)) {
            const files = fs.readdirSync(dir).filter((name) => name.endsWith('.json'))
              .map((name) => ({ name, mtime: fs.statSync(path.join(dir, name)).mtimeMs }))
              .sort((a, b) => b.mtime - a.mtime);
            for (const file of files) {
              try { report = JSON.parse(fs.readFileSync(path.join(dir, file.name), 'utf8')); break; } catch {}
            }
          }
          const scoreValue = report?.officialScore?.value ?? report?.score?.value ?? null;
          const complete = report?.status === 'complete' && scoreValue !== null;
          const stage = String(report?.failedStage || (complete ? 'complete' : 'workflow')).replace(/[^A-Za-z0-9_.-]/g, '-').slice(0, 80);
          const description = complete ? `complete official score=${String(scoreValue).slice(0, 40)}` : `failed stage=${stage}`;
          fs.writeFileSync('/tmp/status.json', JSON.stringify({
            state: complete ? 'success' : 'failure',
            context: 'real-public-benchmark-recorded',
            description: description.slice(0, 140),
            target_url: process.env.STATUS_TARGET,
          }));
          NODE
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --input /tmp/status.json
